<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="圣诞老人和麋鹿同框，沿用璀璨圣诞树原有的星形、霜晶、金籽与光球。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="圣诞老人和麋鹿 · 粒子示意 V2">
  <meta property="og:description" content="由圣诞树的星形、霜晶、金籽与光球组成。">
  <meta property="og:image" content="https://lyoko-233.github.io/christmas-tree/santa-and-reindeer-v2.png">
  <meta name="theme-color" content="#0b101a">
  <title>圣诞老人和麋鹿 · 粒子示意 V2</title>
  <style>
    :root {color-scheme:dark;background:#0b101a;color:#f5e8d4;font-family:"Segoe UI","Microsoft YaHei",sans-serif}
    * {box-sizing:border-box}
    body {margin:0}
    main {max-width:1220px;margin:auto;padding:clamp(22px,4vw,52px) clamp(16px,4vw,52px)}
    header {display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
    h1,p {margin:0}
    h1 {font-weight:600;font-size:clamp(24px,4vw,40px);letter-spacing:.045em}
    p {margin-top:7px;color:#cbbba0;font-size:14px}
    a {color:#ffe0a0}
    .play {display:inline-flex;align-items:center;min-height:44px;padding:0 15px;border:1px solid #8a6b41;
      border-radius:8px;background:#2a231f;text-decoration:none;font-size:14px}
    .play:hover {background:#3b2f24}
    a:focus-visible {outline:2px solid #ffe0a0;outline-offset:3px}
    img {width:100%;height:auto;display:block;border:1px solid #343043;border-radius:12px}
    footer {margin-top:17px;color:#baa991;font-size:12px}
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>圣诞老人和麋鹿</h1>
        <p>粒子示意 V2 · 沿用圣诞树原来的形状与配色</p>
      </div>
      <a class="play" href="./tree/">打开互动圣诞树 V17</a>
    </header>
    <img src="./santa-and-reindeer-v2.png" width="1440" height="810"
      alt="金色、暖红和冰蓝的粒子组成圣诞老人和麋鹿。老人举着礼盒，麋鹿侧身相对。">
    <footer>互动版基于 <a href="https://github.com/nobody-r/christmas-tree">nobody-r/christmas-tree</a>。</footer>
  </main>
</body>
</html>
